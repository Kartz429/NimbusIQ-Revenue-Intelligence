name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, sqlfluff, yamllint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: sqlfluff lint nimbusiq/models nimbusiq/tests
      - run: yamllint .

  python-tests:
    name: Python tests and dataset validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python scripts/validate_datasets.py
      - run: python -m pytest -q

  dbt-parse:
    name: dbt deps + parse (no warehouse needed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DBT_PROFILES_DIR: profiles
      DBT_TARGET: dev
      # Dummy values: `dbt parse` loads the profile but never connects.
      SNOWFLAKE_ACCOUNT: dummy
      SNOWFLAKE_USER: dummy
      SNOWFLAKE_PASSWORD: dummy
    defaults:
      run:
        working-directory: nimbusiq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: dbt deps
      - run: dbt parse --no-partial-parse

  dbt-build:
    name: dbt build on Snowflake (isolated PR schemas)
    # Runs only when the repo variable ENABLE_SNOWFLAKE_CI is "true" and the PR
    # comes from this repository (forks never receive secrets).
    if: >-
      vars.ENABLE_SNOWFLAKE_CI == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [dbt-parse]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dbt-ci-${{ github.event.number || github.sha }}
      cancel-in-progress: true
    env:
      DBT_PROFILES_DIR: profiles
      DBT_TARGET: ci
      DBT_SCHEMA: CI_PR_${{ github.event.number || 'MAIN' }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE || 'TRANSFORMER_ROLE' }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE || 'NIMBUSIQ_WH' }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE || 'NIMBUSIQ' }}
    defaults:
      run:
        working-directory: nimbusiq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: dbt deps
      - run: dbt debug
      - run: dbt build --full-refresh
      - name: Drop CI schemas
        if: always()
        run: |
          dbt run-operation drop_ci_schemas --args "{schema_prefix: ${DBT_SCHEMA}}"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: nimbusiq-dbt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
