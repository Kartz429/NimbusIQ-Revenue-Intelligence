name: Deploy (production dbt run)

on:
  workflow_dispatch:
    inputs:
      full_refresh_events:
        description: "Rebuild int_events_incremental from scratch"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *"   # daily, 02:00 UTC

# Never run two production builds at once, never cancel one half-way.
concurrency:
  group: dbt-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: dbt build --target prod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Add required reviewers to this environment in GitHub settings for a manual gate.
    environment: production
    env:
      DBT_PROFILES_DIR: profiles
      DBT_TARGET: prod
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE || 'TRANSFORMER_ROLE' }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE || 'NIMBUSIQ_WH' }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE || 'NIMBUSIQ' }}
    defaults:
      run:
        working-directory: nimbusiq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - run: dbt deps
      - run: dbt debug
      - run: dbt seed
      - name: Optional full refresh of the incremental events model
        if: ${{ inputs.full_refresh_events }}
        run: dbt run --full-refresh --select int_events_incremental
      - name: Source freshness (warn only)
        continue-on-error: true
        run: dbt source freshness
      - name: Build models, tests and snapshots
        run: dbt build --exclude resource_type:seed
      - name: Generate docs
        if: always()
        run: dbt docs generate
      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-${{ github.run_id }}
          path: |
            nimbusiq/target/manifest.json
            nimbusiq/target/run_results.json
            nimbusiq/target/catalog.json
            nimbusiq/target/index.html
          retention-days: 30
