version: 2

sources:
  - name: raw
    description: >
      Tables loaded by Airbyte into Snowflake RAW from the NimbusIQ CSV exports.
      dbt never writes here; the TRANSFORMER_ROLE has read-only access.
    database: "{{ var('raw_database') }}"
    schema: "{{ var('raw_schema') }}"
    # Datasets come from static CSVs, so freshness thresholds are generous.
    # Tighten them once a real incremental feed is connected.
    loaded_at_field: _airbyte_extracted_at
    config:
      freshness:
        warn_after: {count: 30, period: day}
        error_after: {count: 90, period: day}
    tables:
      - name: customers
        identifier: CUSTOMERS
        description: One row per customer account.
      - name: subscriptions
        identifier: SUBSCRIPTIONS
        description: One row per subscription (plan, price, status, dates).
      - name: payments
        identifier: PAYMENTS
        description: One row per payment transaction, in the payer's currency.
      - name: events
        identifier: EVENTS
        description: Product usage events.
      - name: tickets
        identifier: TICKETS
        description: Customer support tickets.
      - name: feature_usage
        identifier: FEATURE_USAGE
        description: Daily feature usage counters per customer.
